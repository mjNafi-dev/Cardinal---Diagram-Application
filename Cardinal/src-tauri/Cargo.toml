[package]
name = "cardinal"
version = "0.2.1"
description = "Cardinal: offline ER diagrams and logic circuits"
authors = ["Mahir Jabid Nafi"]
edition = "2021"

[lib]
name = "cardinal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
